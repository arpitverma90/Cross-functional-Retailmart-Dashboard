<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Executive Login · RetailMart V3 Analytics</title>
    
    <!-- Fonts: Outfit (Headings) & Inter (Body & Data) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.31.0/dist/tabler-icons.min.css">
    
    <style>
        :root {
            --navy-dark: #0F1F33;
            --navy-card: #183A5F;
            --blue-border: #24598A;
            --text-white: #FFFFFF;
            --text-light: #D5DCE5;
            --text-muted: #8E9BAE;
            --purple: #A459D0;
            --purple-glow: rgba(164, 89, 208, 0.25);
            --cyan: #2CD4E1;
            --cyan-glow: rgba(44, 212, 225, 0.2);
            --green: #34D399;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--navy-dark);
            color: var(--text-light);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            background-image: 
                radial-gradient(circle at 20% 20%, rgba(164, 89, 208, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 80% 80%, rgba(44, 212, 225, 0.08) 0%, transparent 40%);
        }

        .login-card {
            width: 100%;
            max-width: 450px;
            background: linear-gradient(180deg, var(--navy-card) 0%, #122c48 100%);
            border: 1px solid var(--blue-border);
            border-radius: 16px;
            padding: 2.5rem 2.25rem;
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.55);
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .brand-icon {
            width: 56px;
            height: 56px;
            border-radius: 14px;
            background: linear-gradient(135deg, var(--navy-card) 0%, var(--purple) 100%);
            border: 1px solid var(--blue-border);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 1rem;
            box-shadow: 0 4px 18px var(--purple-glow);
        }

        .brand-title {
            font-family: 'Outfit', sans-serif;
            font-size: 1.7rem;
            font-weight: 800;
            color: var(--text-white);
            margin-bottom: 0.3rem;
            letter-spacing: -0.01em;
        }

        .brand-subtitle {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .alert-box {
            display: none;
            padding: 0.75rem 1rem;
            border-radius: 8px;
            margin-bottom: 1.25rem;
            font-size: 0.82rem;
            align-items: center;
            gap: 0.5rem;
            line-height: 1.4;
        }

        .alert-success {
            background: rgba(52, 211, 153, 0.12);
            border: 1px solid rgba(52, 211, 153, 0.4);
            color: var(--green);
        }

        .alert-error {
            background: rgba(248, 113, 113, 0.12);
            border: 1px solid rgba(248, 113, 113, 0.4);
            color: #F87171;
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        .form-label {
            display: block;
            font-size: 0.72rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            margin-bottom: 0.45rem;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-icon {
            position: absolute;
            left: 0.85rem;
            color: var(--text-muted);
            font-size: 1.1rem;
            pointer-events: none;
        }

        .form-input {
            width: 100%;
            background-color: rgba(15, 31, 51, 0.85);
            border: 1px solid var(--blue-border);
            color: var(--text-white);
            border-radius: 8px;
            padding: 0.7rem 0.85rem 0.7rem 2.5rem;
            font-size: 0.9rem;
            font-family: inherit;
            outline: none;
            transition: all 0.2s ease;
        }

        .form-input:focus {
            border-color: var(--cyan);
            box-shadow: 0 0 0 3px var(--cyan-glow);
        }

        .btn-submit {
            width: 100%;
            background: linear-gradient(135deg, var(--purple) 0%, #7C3AED 100%);
            color: #FFFFFF;
            border: none;
            padding: 0.8rem 1rem;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            box-shadow: 0 4px 14px var(--purple-glow);
            margin-top: 0.5rem;
        }

        .btn-submit:hover {
            opacity: 0.92;
            transform: translateY(-1px);
            box-shadow: 0 6px 18px var(--purple-glow);
        }

        .demo-credentials-card {
            margin-top: 1.75rem;
            padding-top: 1.25rem;
            border-top: 1px solid rgba(36, 89, 138, 0.4);
            font-size: 0.8rem;
            color: var(--text-muted);
            text-align: center;
        }

        .demo-tag {
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--cyan);
            margin-bottom: 0.45rem;
        }

        .credentials-pill {
            background: rgba(15, 31, 51, 0.7);
            border: 1px solid var(--blue-border);
            border-radius: 6px;
            padding: 0.4rem 0.75rem;
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
            margin-top: 0.25rem;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.8rem;
            color: var(--text-light);
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .credentials-pill:hover {
            border-color: var(--cyan);
            color: var(--cyan);
        }

        .footer-links {
            margin-top: 1.5rem;
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .footer-links a {
            color: var(--text-muted);
            text-decoration: none;
            transition: color 0.15s ease;
        }

        .footer-links a:hover {
            color: var(--cyan);
        }
    </style>
</head>
<body>
    <div class="login-card">
        <!-- Logo & Branding -->
        <div style="text-align: center; margin-bottom: 1.75rem;">
            <div class="brand-icon">
                <i class="ti ti-shield-lock" style="font-size: 1.9rem; color: #fff;"></i>
            </div>
            <h1 class="brand-title">
                RetailMart <span style="color: var(--purple);">V3</span>
            </h1>
            <p class="brand-subtitle">
                Enterprise Business Intelligence Portal
            </p>
        </div>

        <!-- Logout / Status Alert Box -->
        <div id="status-alert" class="alert-box">
            <i id="alert-icon" class="ti ti-circle-check" style="font-size: 1.15rem; flex-shrink: 0;"></i>
            <span id="alert-text">You have been signed out successfully.</span>
        </div>

        <!-- Login Form -->
        <form id="login-form" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label class="form-label" for="username">Executive Username</label>
                <div class="input-wrapper">
                    <i class="ti ti-user input-icon"></i>
                    <input type="text" id="username" class="form-input" placeholder="Enter username" value="admin" required autofocus>
                </div>
            </div>

            <div class="form-group" style="margin-bottom: 1.5rem;">
                <label class="form-label" for="password">Password</label>
                <div class="input-wrapper">
                    <i class="ti ti-lock input-icon"></i>
                    <input type="password" id="password" class="form-input" placeholder="Enter password" value="admin123" required>
                </div>
            </div>

            <button type="submit" class="btn-submit" id="btn-login">
                <i class="ti ti-login"></i> Access Analytics Platform
            </button>
        </form>

        <!-- Default Demo Credentials Card -->
        <div class="demo-credentials-card">
            <div class="demo-tag">Verified Demo Access</div>
            <div style="font-size: 0.78rem; margin-bottom: 0.35rem;">Click to auto-fill credentials:</div>
            <div class="credentials-pill" onclick="autoFillDemo()" title="Click to auto-fill">
                <span>user: <strong style="color: var(--cyan);">admin</strong></span>
                <span>•</span>
                <span>pass: <strong style="color: var(--cyan);">admin123</strong></span>
            </div>
        </div>

        <!-- Footer Links -->
        <div class="footer-links">
            <a href="https://github.com/arpitverma90/Cross-functional-Retailmart-Dashboard" target="_blank">
                <i class="ti ti-brand-github"></i> arpitverma90
            </a>
            <span>PostgreSQL 18.4 · 2.4M Rows</span>
        </div>
    </div>

    <script>
        // Check if redirected from a logout action
        const urlParams = new URLSearchParams(window.location.search);
        const statusAlert = document.getElementById('status-alert');
        const alertText = document.getElementById('alert-text');
        const alertIcon = document.getElementById('alert-icon');

        if (urlParams.get('logout') === 'true') {
            statusAlert.className = 'alert-box alert-success';
            statusAlert.style.display = 'flex';
            alertIcon.className = 'ti ti-circle-check';
            alertText.innerText = 'You have been successfully signed out of the executive portal.';
            localStorage.removeItem('retailmart_session');
        }

        function autoFillDemo() {
            document.getElementById('username').value = 'admin';
            document.getElementById('password').value = 'admin123';
        }

        function handleLogin(e) {
            e.preventDefault();
            const u = document.getElementById('username').value.trim();
            const p = document.getElementById('password').value.trim();
            const btn = document.getElementById('btn-login');

            if (!u || !p) {
                statusAlert.className = 'alert-box alert-error';
                statusAlert.style.display = 'flex';
                alertIcon.className = 'ti ti-alert-circle';
                alertText.innerText = 'Please enter both username and password.';
                return;
            }

            // Simulate authentication & redirect
            btn.innerHTML = '<i class="ti ti-loader-2 ti-spin"></i> Authenticating...';
            btn.style.opacity = '0.75';
            btn.disabled = true;

            localStorage.setItem('retailmart_session', 'active');
            localStorage.setItem('retailmart_user', u);

            setTimeout(() => {
                window.location.href = 'index.html?login=success';
            }, 400);
        }
    </script>
</body>
</html>
